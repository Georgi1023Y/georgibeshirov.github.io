# GitHub Pages — build injects Vite env from repository Secrets (Settings → Secrets and variables → Actions).
# Required secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (embedded at build time; restart deploy after rotating keys).
# Pages: Settings → Pages → Build and deployment → Source = GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Vite only exposes vars prefixed with VITE_; available to npm run build and any script in this job.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Optional: full Upwork profile URL for primary CTAs (embedded at build time).
      VITE_UPWORK_PROFILE_URL: ${{ secrets.VITE_UPWORK_PROFILE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure Supabase secrets are configured for production build
        run: |
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "::error::Missing Actions secret VITE_SUPABASE_URL — add it under repo Settings → Secrets → Actions."
            exit 1
          fi
          if [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Missing Actions secret VITE_SUPABASE_ANON_KEY — add it under repo Settings → Secrets → Actions."
            exit 1
          fi
          echo "VITE_SUPABASE_* env vars present for Vite build (values not printed)."

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
